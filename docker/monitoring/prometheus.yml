# Prometheus scrape config for xbase. Add one target per SaaS backend.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  # Rust SaaS backends expose /metrics on the shared Docker network.
  # If METRICS_TOKEN is set, uncomment `authorization`.
  - job_name: xbase-backends
    metrics_path: /metrics
    # authorization:
    #   credentials: change-me-metrics-token
    # DNS discovery scrapes every replica of each compose service (autoscaling).
    dns_sd_configs:
      - names: ["saas-api-1", "saas-api-2"]
        type: A
        port: 3000
        refresh_interval: 15s
