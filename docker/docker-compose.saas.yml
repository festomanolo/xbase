# =============================================================================
# xbase — Multi-SaaS Rust/Go Backends + Caddy Reverse Proxy
# Connects to the self-hosted Supabase network and Supavisor pooler (port 6543)
#
#   docker compose --env-file ../supabase-project/.env -f docker-compose.saas.yml up -d --build
#
# Add SaaS #3..#10 by copying the `saas-api-1` block (YAML anchor below),
# giving each a unique APP_ID and Caddy route.
#
# Replicas: `docker compose up -d --scale saas-api-1=3`, or let scaler/ do it.
# Every app with >1 replica needs RATE_LIMIT_BACKEND=postgres + REALTIME_CLUSTER=true.
# =============================================================================

x-rust-backend: &rust-backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  image: xbase-backend:latest
  restart: unless-stopped
  expose:
    - "3000"
  networks:
    - default
    - supabase_default
  # No container_name: the autoscaler (scaler/) runs `docker compose up --scale`,
  # which needs compose to name replicas itself (xbase-saas-api-1-1, -2, ...).
  stop_grace_period: 30s # in-flight requests drain on SIGTERM
  deploy:
    resources:
      limits:
        memory: 64M
        cpus: "1.0" # keep equal to cores_per_replica in scaler.json

x-rust-env: &rust-env
  HOST: "0.0.0.0"
  PORT: "3000"
  # Request traffic: Supavisor transaction pooler on port 6543 (NOT direct 5432)
  DATABASE_URL: "postgres://postgres.${POOLER_TENANT_ID:-your-tenant-id}:${POSTGRES_PASSWORD}@supavisor:6543/postgres"
  # Migrations + realtime LISTEN/NOTIFY: direct session connection
  DIRECT_DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres"
  RUN_MIGRATIONS: "true"
  DB_MAX_CONNECTIONS: "5"
  SUPABASE_JWT_SECRET: "${JWT_SECRET}"
  SUPABASE_URL: "http://kong:8000"
  SUPABASE_PUBLIC_URL: "${API_EXTERNAL_URL:-http://localhost:8000}"
  SUPABASE_ANON_KEY: "${ANON_KEY}"
  SUPABASE_SERVICE_ROLE_KEY: "${SERVICE_ROLE_KEY}"
  TRUST_PROXY_HEADERS: "true"
  RATE_LIMIT_PER_SECOND: "20"
  RATE_LIMIT_BURST: "60"
  # memory = per-process buckets. Use `postgres` as soon as an app runs >1 replica
  # (one shared bucket per key; falls back to local on a DB blip).
  RATE_LIMIT_BACKEND: "${RATE_LIMIT_BACKEND:-memory}"
  JOBS_ENABLED: "true"
  REALTIME_ENABLED: "true"
  # true when an app runs >1 replica: rooms/presence fan out through Postgres NOTIFY.
  REALTIME_CLUSTER: "${REALTIME_CLUSTER:-false}"
  # PostgREST-style CRUD at /api/v1/rest/:table (RLS-enforced). Off by default.
  REST_ENABLED: "${REST_ENABLED:-false}"
  REST_SCHEMAS: "${REST_SCHEMAS:-public}"
  RUST_LOG: "xbase_backend=info,tower_http=info"

services:
  caddy:
    image: caddy:2-alpine
    container_name: xbase-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - supabase_default

  # --- SaaS #1: Rust (full platform API) ------------------------------------
  saas-api-1:
    <<: *rust-backend
    environment:
      <<: *rust-env
      APP_ID: "saas-app-1"
      CORS_ALLOWED_ORIGINS: "https://app1.yourdomain.com"
      STRIPE_WEBHOOK_SECRET: "${SAAS1_STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_PLANS: "${SAAS1_STRIPE_PRICE_PLANS:-}"
      EMBEDDING_API_URL: "${EMBEDDING_API_URL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"

  # --- Horizontal scaling ---------------------------------------------------
  # Replicas of a service share its APP_ID. Scale with
  #   docker compose ... up -d --no-recreate --scale saas-api-1=3
  # or run scaler/ (autoscaling + zero-downtime deploys). Caddy and Prometheus
  # discover replicas through Docker DNS. Before going above 1 replica set
  # RATE_LIMIT_BACKEND=postgres and REALTIME_CLUSTER=true in the env file.

  # --- SaaS #2: Go (same feature set: storage, realtime, billing, vector) ---
  saas-api-2:
    build:
      context: ../go-backend
    image: xbase-go-backend:latest
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      - saas-api-1 # Rust backend applies the shared migrations
    environment:
      APP_ID: "saas-app-2"
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: "postgres://postgres.${POOLER_TENANT_ID:-your-tenant-id}:${POSTGRES_PASSWORD}@supavisor:6543/postgres"
      # Realtime LISTEN/NOTIFY needs the direct session connection
      DIRECT_DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres"
      DB_MAX_CONNECTIONS: "5"
      SUPABASE_JWT_SECRET: "${JWT_SECRET}"
      SUPABASE_URL: "http://kong:8000"
      SUPABASE_PUBLIC_URL: "${API_EXTERNAL_URL:-http://localhost:8000}"
      SUPABASE_ANON_KEY: "${ANON_KEY}"
      SUPABASE_SERVICE_ROLE_KEY: "${SERVICE_ROLE_KEY}"
      CORS_ALLOWED_ORIGINS: "https://app2.yourdomain.com"
      TRUST_PROXY_HEADERS: "true"
      RATE_LIMIT_BACKEND: "${RATE_LIMIT_BACKEND:-memory}"
      REALTIME_CLUSTER: "${REALTIME_CLUSTER:-false}"
      STRIPE_WEBHOOK_SECRET: "${SAAS2_STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_PLANS: "${SAAS2_STRIPE_PRICE_PLANS:-}"
      EMBEDDING_API_URL: "${EMBEDDING_API_URL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
    expose:
      - "3000"
    networks:
      - default
      - supabase_default
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "1.0"

networks:
  supabase_default:
    external: true

volumes:
  caddy_data:
  caddy_config:
